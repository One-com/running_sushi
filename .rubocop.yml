plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  SuggestExtensions: false

# RSpec example groups and the gemspec are naturally long blocks.
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'

# Development dependencies are intentionally declared in the gemspec.
Gemspec/DevelopmentDependencies:
  EnforcedStyle: gemspec

# These specs test the top-level methods of bin/running-sushi, which belong to
# no class or module, so there is nothing to name in the describe.
RSpec/DescribeClass:
  Exclude:
    - 'spec/**/sushi_*_spec.rb'
